<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>雅思真经词汇 · 图解点读</title>
<style>
:root{
  --bg:#F8F4E9;                 /* 奶白 cream */
  --panel-bg:rgba(255,253,250,0.86); /* 粉白磨砂 frosted */
  --panel-solid:#FFFDFA;
  --text:#775C55;               /* 巧克力棕 chocolate */
  --muted:#A9938B;
  --accent:#775C55;             /* 巧克力棕 */
  --mint:#D5EAE3;               /* 薄荷绿 */
  --mint-strong:#B9D8CD;
  --pink:#FDD3D5;               /* 柔粉 */
  --pink-soft:#FBE7E8;
  --border:#F0E1DB;             /* soft pink-brown */
  --header-h:56px;
  --sidebar-w:260px;
  --panel-w:360px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
.app{height:100vh;display:flex;flex-direction:column}
header{height:var(--header-h);background:var(--panel-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0;z-index:20}
header .left{display:flex;align-items:center;gap:10px}
header .title{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
header .subtitle{font-size:12px;color:var(--muted);margin-left:6px}
header .right{display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 12px;border:1px solid var(--border);border-radius:16px;background:var(--panel-solid);color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap;transition:all .15s}
.btn:hover{border-color:var(--mint-strong);color:var(--accent);background:var(--pink-soft)}
.btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.btn svg{width:16px;height:16px;fill:currentColor}
.main{flex:1;display:flex;overflow:hidden;position:relative}
.sidebar{width:var(--sidebar-w);background:var(--panel-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-right:1px solid var(--border);overflow-y:auto;transition:transform .25s ease;flex-shrink:0}
.sidebar.hidden{transform:translateX(-100%);position:absolute;left:0;top:0;bottom:0;z-index:15}
.chapter{border-bottom:1px solid var(--border)}
.chapter-header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;font-weight:600;font-size:14px;background:transparent;color:var(--text)}
.chapter-header:hover{background:var(--pink-soft)}
.chapter-header .arrow{transition:transform .2s;font-size:12px;color:var(--muted)}
.chapter.open .arrow{transform:rotate(90deg)}
.chapter-body{display:none}
.chapter.open .chapter-body{display:block}
.image-link{padding:9px 28px;font-size:13px;color:var(--muted);cursor:pointer;border-left:3px solid transparent}
.image-link:hover{background:var(--mint);color:var(--accent)}
.image-link.active{background:var(--mint-strong);color:var(--accent);border-left-color:var(--accent);font-weight:600}
.viewer{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);position:relative;overflow:hidden}
.img-wrap{position:relative;max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center}
.img-wrap img{max-width:100%;max-height:calc(100vh - var(--header-h) - 20px);object-fit:contain;display:block;box-shadow:0 4px 20px rgba(119,92,85,.12);background:#fff;border-radius:16px}
.hotspot{position:absolute;border:2px solid rgba(185,216,205,0);background:rgba(185,216,205,0);border-radius:16px;cursor:pointer;transition:all .15s;z-index:5}
.hotspot:hover,.hotspot.active{border-color:rgba(119,92,85,.55);background:rgba(213,234,227,.55);box-shadow:0 0 0 2px rgba(213,234,227,.35)}
.word-panel{position:absolute;right:0;top:0;bottom:0;width:var(--panel-w);background:var(--panel-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .25s ease;z-index:18;display:flex;flex-direction:column}
.word-panel.open{transform:translateX(0)}
.word-panel-header{padding:12px 14px;border-bottom:1px solid var(--border);font-weight:600;display:flex;justify-content:space-between;align-items:center;background:transparent;color:var(--text)}
.word-list{flex:1;overflow-y:auto;padding:10px}
.word-card{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:16px;margin-bottom:8px;background:var(--panel-solid);cursor:pointer;transition:background .15s}
.word-card:hover{background:var(--pink-soft)}
.word-card.active{background:var(--mint);border-color:var(--mint-strong)}
.word-card .play{width:32px;height:32px;border-radius:50%;border:1px solid var(--mint-strong);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--mint)}
.word-card .play svg{width:14px;height:14px;fill:currentColor}
.word-card .side-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--mint-strong);background:var(--mint);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:15px;line-height:1;margin-left:8px;transition:all .15s}
.word-card .side-btn:hover{background:var(--pink-soft);border-color:var(--accent)}
.word-card .side-btn.added{background:var(--mint-strong);color:#fff}
.word-card .side-btn.del{border-color:var(--pink);background:var(--pink-soft);color:var(--accent)}
.word-card .side-btn.del:hover{background:var(--pink)}
.word-card .info{flex:1;min-width:0}
.word-card .word{font-size:16px;font-weight:600;color:var(--text);line-height:1.3}
.word-card .word .cn{color:var(--muted);font-weight:400;margin-left:8px;font-size:14px}
.word-card .meta{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-state{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.mobile-mask{display:none;position:absolute;inset:0;background:rgba(119,92,85,.2);z-index:14}
@media(max-width:768px){
  :root{--sidebar-w:220px;--panel-w:100%}
  header .title{max-width:30vw}
  header .subtitle{display:none}
  .btn{padding:0 8px;font-size:12px}
  .word-panel{top:auto;height:55vh;border-radius:16px 16px 0 0;border-left:none}
  .mobile-mask.show{display:block}
}
.viewer.fullscreen{position:fixed;inset:0;z-index:100;background:var(--bg)}
.viewer.fullscreen img{max-height:100vh}
.viewer.fullscreen ~ .word-panel,.viewer.fullscreen ~ .sidebar{display:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="left">
      <button class="btn" id="menuBtn" title="目录">☰ 目录</button>
      <span class="title" id="pageTitle">雅思真经词汇</span>
      <span class="subtitle" id="pageSubtitle"></span>
    </div>
    <div class="right">
      <button class="btn" data-view="real">真实彩图</button>
      <button class="btn" id="listBtn" title="单词列表">单词列表</button>
      <button class="btn" id="bookBtn" title="单词本">单词本</button>
      <button class="btn" id="fsBtn" title="全屏点读">全屏点读</button>
    </div>
  </header>
  <div class="main">
    <div class="mobile-mask" id="mask"></div>
    <aside class="sidebar" id="sidebar"></aside>
    <section class="viewer" id="viewer">
      <div class="img-wrap" id="imgWrap"></div>
    </section>

        <button class="btn" id="closePanelBtn">关闭</button>
      </div>
      <div class="word-list" id="wordList"></div>

    <aside class="word-panel" id="bookPanel">
      <div class="word-panel-header">
        <span id="bookTitle">单词本 (<span id="bookCount">0</span>)</span>
        <button class="btn" id="closeBookBtn">关闭</button>
      </div>
      <div class="word-list" id="bookList"></div>
    </aside>
  </div>
</div>

const CN_MAP = (()=>{const m={};(VOCAB_DATA||[]).forEach(ch=>(ch.images||[]).forEach(img=>(img.words||[]).forEach(w=>{if(w&&w.s&&w.cn)m[w.s]=w.cn;})));return m;})();
let chIdx = 0, imgIdx = 0, viewMode = 'real', panelOpen = false, sidebarOpen = true, fullscreen = false, bookOpen = false;
let lastWord = '';

function $(id){return document.getElementById(id)}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escA(s){return esc(String(s==null?'':s)).replace(/"/g,'&quot;')}

function renderSidebar(){
  const sb = $('sidebar');
  sb.innerHTML = VOCAB_DATA.map((ch,i)=>`
    <div class="chapter ${i===chIdx?'open':''}" data-ci="${i}">
      <div class="chapter-header">
        <span>第${ch.num}章 ${esc(ch.title_cn)}</span>
        <span class="arrow">▶</span>
      </div>
      <div class="chapter-body">
        ${ch.images.map((img,j)=>`<div class="image-link ${i===chIdx&&j===imgIdx?'active':''}" data-ci="${i}" data-ii="${j}">${img.id}</div>`).join('')}
      </div>
    </div>
  `).join('');
  sb.querySelectorAll('.chapter-header').forEach(h=>h.onclick=(e)=>{
    const el = h.closest('.chapter');
    el.classList.toggle('open');
  });
  sb.querySelectorAll('.image-link').forEach(l=>l.onclick=()=>{
    loadImage(+l.dataset.ci, +l.dataset.ii);
    if(window.innerWidth<=768){sidebarOpen=false;$('sidebar').classList.add('hidden');$('mask').classList.remove('show');}
  });
}

function currentImage(){ return VOCAB_DATA[chIdx].images[imgIdx]; }

function imgPath(file){
  return 'images/'+file;
}

function loadImage(ci, ii){
  chIdx = ci; imgIdx = ii;
  renderSidebar();
  const ch = VOCAB_DATA[chIdx], img = currentImage();
  $('pageTitle').textContent = `第${ch.num}章 ${ch.title_cn}`;
  $('pageSubtitle').textContent = img.id;
  const wrap = $('imgWrap');
  wrap.innerHTML = `<img src="${imgPath(img.file)}" alt="${esc(img.id)}" id="mainImg">`;
  const imgEl = $('mainImg');
  imgEl.onload = ()=> renderHotspots(imgEl, img);
  imgEl.onerror = ()=> wrap.innerHTML = '<div class="empty-state">图片加载失败</div>';
  if(imgEl.complete) renderHotspots(imgEl, img);
  renderWordList(img);
  updateViewButtons();
}

function renderHotspots(imgEl, img){
  const wrap = $('imgWrap');
  wrap.querySelectorAll('.hotspot').forEach(h=>h.remove());
  const W = imgEl.offsetWidth, H = imgEl.offsetHeight;
  const natW = imgEl.naturalWidth, natH = imgEl.naturalHeight;
  const scaleX = W / natW, scaleY = H / natH;
  const add = (list, cls) => {
    list.forEach(b=>{
      const div = document.createElement('div');
      div.className = 'hotspot '+cls;
      div.style.left = (b.x*100)+'%';
      div.style.top = (b.y*100)+'%';
      div.style.width = (b.w*100)+'%';
      div.style.height = (b.h*100)+'%';
      div.title = b.s;
      div.dataset.word = b.s;
      div.onclick = (e)=>{ e.stopPropagation(); speak(b.s, div); };
      wrap.appendChild(div);
    });
  };
  add(img.bubbles||[], 'bubble');
  add(img.standalone||[], 'word');
}

function renderWordList(img){
  $('panelTitle').textContent = `${img.id} 单词 (${(img.words||[]).length})`;
  const list = $('wordList');
  if(!img.words||!img.words.length){
    list.innerHTML = '<div class="empty-state">本页未识别到单词</div>';
    return;
  }
  const book = getBook();
  list.innerHTML = img.words.map((w)=>{
    const ph = w.ph?escA(w.ph):'';
    const added = book.some(x=>x.s===w.s);
    return `<div class="word-card" data-word="${escA(w.s)}">
      <div class="play">${playIcon}</div>
      <div class="info"><div class="word">${esc(w.s)}</div>${ph?`<div class="meta">${ph}</div>`:''}</div>
      <button class="side-btn ${added?'added':''}" data-add="${escA(w.s)}" data-ph="${escA(w.ph||'')}" data-cn="${escA(w.cn||'')}" title="${added?'已在单词本（点击移除）':'加入单词本'}">${added?'✓':'➕'}</button>
    </div>`;
  }).join('');
  list.querySelectorAll('.word-card').forEach(card=>{
    card.onclick = (e)=>{ if(e.target.closest('.side-btn')) return; speak(card.dataset.word, null, card); };
  });
  list.querySelectorAll('.side-btn').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    if(b.classList.contains('added')){ removeFromBook(b.dataset.add); }
    else { addToBook(b.dataset.add, b.dataset.ph, b.dataset.cn); }
    renderWordList(currentImage());
  });
}

const playIcon = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';

function speak(word, hotspotDiv, cardDiv){
  if(!word) return;
  lastWord = word;
  // highlight
  document.querySelectorAll('.hotspot, .word-card').forEach(el=>el.classList.remove('active'));
  if(hotspotDiv) hotspotDiv.classList.add('active');
  if(cardDiv) cardDiv.classList.add('active');
  document.querySelectorAll(`.hotspot[data-word="${CSS.escape(word)}"], .word-card[data-word="${CSS.escape(word)}"]`).forEach(el=>el.classList.add('active'));
  // TTS
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(word);
    u.lang = 'en-GB';
    u.rate = 0.9;
    const voices = window.speechSynthesis.getVoices();
    const gb = voices.find(v=>v.lang.startsWith('en-GB')) || voices.find(v=>v.lang.startsWith('en'));
    if(gb) u.voice = gb;
    window.speechSynthesis.speak(u);
  }
}

const BOOK_KEY = 'ielts_wordbook_v1';
function getBook(){ try{ return JSON.parse(localStorage.getItem(BOOK_KEY)||'[]'); }catch(e){ return []; } }
function saveBook(arr){ try{ localStorage.setItem(BOOK_KEY, JSON.stringify(arr)); }catch(e){} }
function addToBook(s, ph, cn){
  const book = getBook();
  if(book.some(w=>w.s===s)) return;
  book.push({s:s, ph:ph||'', cn:(cn||CN_MAP[s]||'')});
  saveBook(book);
}
function removeFromBook(s){
  saveBook(getBook().filter(w=>w.s!==s));
}
function renderBook(){
  const raw = getBook();
  let changed = false;
  const book = raw.map(w=>{ if(!w.cn && CN_MAP[w.s]){ changed=true; return Object.assign({}, w, {cn:CN_MAP[w.s]}); } return w; });
  if(changed) saveBook(book);
  $('bookCount').textContent = book.length;
  const list = $('bookList');
  if(!book.length){
    list.innerHTML = '<div class="empty-state">还没有收藏的单词<br>在单词列表点击 ➕ 加入</div>';
    return;
  }
  list.innerHTML = book.map(w=>`<div class="word-card" data-word="${escA(w.s)}">
    <div class="play">${playIcon}</div>
    <div class="info"><div class="word">${esc(w.s)}${w.cn?` <span class="cn">${esc(w.cn)}</span>`:''}</div>${w.ph?`<div class="meta">${esc(w.ph)}</div>`:''}</div>
    <button class="side-btn del" data-del="${escA(w.s)}" title="移除">×</button>
  </div>`).join('');
  list.querySelectorAll('.word-card').forEach(card=>{
    card.onclick = (e)=>{ if(e.target.closest('.side-btn')) return; speak(card.dataset.word, null, card); };
  });
  list.querySelectorAll('.side-btn.del').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation(); removeFromBook(b.dataset.del); renderBook(); if(panelOpen) renderWordList(currentImage());
  });
}
function openBook(){ bookOpen=true; panelOpen=false; $('bookPanel').classList.add('open'); $('wordPanel').classList.remove('open'); renderBook(); }
function closeBook(){ bookOpen=false; $('bookPanel').classList.remove('open'); }

function updateViewButtons(){
  document.querySelectorAll('header .btn[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===viewMode));
}

function togglePanel(){
  panelOpen = !panelOpen;
  $('wordPanel').classList.toggle('open', panelOpen);
  if(panelOpen){ bookOpen=false; $('bookPanel').classList.remove('open'); }
}

function toggleSidebar(){
  sidebarOpen = !sidebarOpen;
  $('sidebar').classList.toggle('hidden', !sidebarOpen);
  $('mask').classList.toggle('show', sidebarOpen && window.innerWidth<=768);
}

function toggleFullscreen(){
  const viewer = $('viewer');
  fullscreen = !fullscreen;
  viewer.classList.toggle('fullscreen', fullscreen);
  if(fullscreen){
    if(viewer.requestFullscreen) viewer.requestFullscreen().catch(()=>{});
  } else {
    if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
  }
  // re-render hotspots after layout change
  setTimeout(()=>{ const img=currentImage(), el=$('mainImg'); if(el) renderHotspots(el,img); }, 350);
}

// event bindings
document.querySelectorAll('header .btn[data-view]').forEach(b=>b.onclick=()=>{
  viewMode = b.dataset.view;
  loadImage(chIdx, imgIdx);
});
$('menuBtn').onclick = toggleSidebar;
$('listBtn').onclick = togglePanel;
$('closePanelBtn').onclick = togglePanel;
$('bookBtn').onclick = ()=>{ if(bookOpen) closeBook(); else openBook(); };
$('closeBookBtn').onclick = closeBook;
$('fsBtn').onclick = toggleFullscreen;
$('mask').onclick = ()=>{ sidebarOpen=false;$('sidebar').classList.add('hidden');$('mask').classList.remove('show'); };

document.addEventListener('fullscreenchange', ()=>{
  fullscreen = !!document.fullscreenElement;
  $('viewer').classList.toggle('fullscreen', fullscreen);
  setTimeout(()=>{ const img=currentImage(), el=$('mainImg'); if(el) renderHotspots(el,img); }, 350);
});

window.onresize = ()=>{ const img=currentImage(), el=$('mainImg'); if(el) renderHotspots(el,img); };

// init
renderSidebar();
loadImage(0,0);
</script>
